services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: boardbite-pos:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 아래 3개는 로컬 개발용 .env 값과 무관하게 컨테이너 배포 기준으로 고정한다.
      # (NODE_ENV=production이어야 세션 쿠키가 정상 동작 — 앞단 Nginx가 HTTPS를 종단하고
      #  X-Forwarded-Proto를 넘겨주는 구성을 전제로 함. server/src/app.ts의 `trust proxy` 참고.)
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "file:/app/server/prisma/data/boardbite.db?connection_limit=1"
    # 요구사항2.md §7.1 — 기본값은 localhost 바인딩이다. 같은 서버의 Nginx가 앞단에서
    # HTTPS를 종단하고 이 포트로 프록시하는 구성을 전제로 하며, 외부에서 3000 포트에
    # 직접 붙을 수 없다. (프록시 없이 외부 공개가 필요하면 HOST_BIND=0.0.0.0으로 바꾸되,
    #  그 경우 HTTPS와 방화벽을 직접 책임져야 한다.)
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3000}:3000"

    # 컨테이너가 추가 권한을 획득하지 못하게 하고, 필요 없는 리눅스 capability는 전부 뗀다.
    # 이 앱은 3000번(비특권 포트)만 열면 되므로 NET_BIND_SERVICE도 필요 없다.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # SQLite DB 파일과 백업 파일을 컨테이너 밖(호스트)에 영속화한다.
      # `docker compose down` 후 다시 `up`해도 데이터가 유지된다.
      # 호스트 디렉터리 소유자는 컨테이너의 node 사용자(uid/gid 1000)여야 한다:
      #   mkdir -p data/db data/backups && sudo chown -R 1000:1000 data
      - ./data/db:/app/server/prisma/data
      - ./data/backups:/app/server/backups
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/healthz',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
