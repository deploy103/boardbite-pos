name: CI

on:
  push:
    branches: [main]
  pull_request:

# 요구사항2.md §8 — 기본은 최소 권한. 더 필요한 job에서만 개별적으로 올린다.
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-test-session-secret-not-for-prod
      ADMINID: admin
      ADMINPASSWORD: ci-test-admin-pw-12345678
      FRONTID: front
      FRONTPW: ci-test-front-pw-12345678
      POSID: pos
      POSPW: ci-test-pos-pw-12345678
      SERVING_ID: serving
      SERVING_PW: ci-test-serving-pw-12345678
      DATABASE_URL: "file:./dev.db"
      # NODE_ENV=test에서는 이 값들이 SESSION_SECRET에서 파생되지만,
      # 실제 운영과 동일한 코드 경로를 타도록 CI에서도 명시적으로 넣어준다.
      AUDIT_HMAC_KEY: ci-test-audit-hmac-key-not-for-prod-0123456789
      MFA_ENCRYPTION_KEY: ci-test-mfa-encryption-key-not-for-prod-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema server/prisma/schema.prisma
      - run: npx tsc -p server/tsconfig.json --noEmit
      - run: npx tsc -p client/tsconfig.json --noEmit
      - name: Server tests
        working-directory: server
        run: npx vitest run
      - run: npm run build:client
      # 공급망 점검: high 이상만 CI를 깨뜨린다(low/moderate는 Dependabot PR로 처리).
      - name: npm audit (high 이상)
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema server/prisma/schema.prisma
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run E2E scenarios
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # PR에서 새로 들어오는 의존성만 검사하므로 push에서는 돌리지 않는다.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
