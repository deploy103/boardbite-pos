name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-test-session-secret-not-for-prod
      ADMINID: admin
      ADMINPASSWORD: ci-test-admin-pw-12345678
      FRONTID: front
      FRONTPW: ci-test-front-pw-12345678
      POSID: pos
      POSPW: ci-test-pos-pw-12345678
      SERVING_ID: serving
      SERVING_PW: ci-test-serving-pw-12345678
      DATABASE_URL: "file:./dev.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema server/prisma/schema.prisma
      - run: npx tsc -p server/tsconfig.json --noEmit
      - run: npx tsc -p client/tsconfig.json --noEmit
      - name: Server tests
        working-directory: server
        run: npx vitest run
      - run: npm run build:client

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run E2E scenarios
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
